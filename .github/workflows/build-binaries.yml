name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to attach builds to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            stable_name: Celluloid.Desktop-macos-aarch64.dmg
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            stable_name: Celluloid.Desktop-macos-x64.dmg
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
            stable_name: Celluloid.Desktop-linux-amd64.AppImage
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
            stable_name: Celluloid.Desktop-windows-x64-setup.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build from main for workflow_dispatch so sidecar/script fixes apply;
          # release events still pin to the published tag.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag_name }}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch yt-dlp + ffmpeg sidecars
        run: pnpm exec node ./scripts/fetch-sidecars.mjs --triple "${{ matrix.rust_target }}" --force

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Prepare App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_PATH_CONTENT: ${{ secrets.APPLE_API_KEY_PATH_CONTENT }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_PATH_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Build Tauri app & upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIDECAR_TRIPLE: ${{ matrix.rust_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ steps.meta.outputs.tag_name }}
          releaseName: Celluloid Desktop ${{ steps.meta.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable download alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag_name }}"
          NAME="${{ matrix.stable_name }}"
          case "${{ matrix.rust_target }}" in
            aarch64-apple-darwin|x86_64-apple-darwin)
              SRC="$(find src-tauri/target -type f -name '*.dmg' | head -n 1 || true)"
              ;;
            *-linux-*)
              SRC="$(find src-tauri/target -type f -name '*.AppImage' | head -n 1 || true)"
              ;;
            *-windows-*)
              SRC="$(find src-tauri/target -type f -name '*setup.exe' | head -n 1 || true)"
              if [ -z "$SRC" ]; then
                SRC="$(find src-tauri/target -type f -name '*.msi' | head -n 1 || true)"
                NAME="Celluloid.Desktop-windows-x64.msi"
              fi
              ;;
          esac
          if [ -z "${SRC:-}" ]; then
            echo "No bundle found for stable alias $NAME"
            find src-tauri/target -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) | head -50 || true
            exit 1
          fi
          echo "Aliasing $SRC → $NAME"
          cp "$SRC" "$NAME"
          gh release upload "$TAG" "$NAME" --clobber --repo "${{ github.repository }}"
